<div id="text" contenteditable="true"></div>

<script>
  const textEl = document.querySelector("#text");

  textEl.addEventListener("keydown", async function (event) {
    if (event.key !== "s") return;
    if (!(navigator.platform.match("Mac") ? event.metaKey : event.ctrlKey))
      return;
    event.preventDefault();

    let body;
    if (event.altKey) {
      body = textEl.innerText;
    } else {
      body = textEl.innerHTML
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&nbsp;/g, " ");
    }

    if (!body) return;

    // 判断内容类型
    let contentType = "text/plain";

    if (/<(\w+)[^>]*>.*<\/\1>/.test(body)) {
      contentType = "text/html";
    }

    try {
      JSON.parse(body);
      contentType = "application/json";
    } catch (error) {}

    const res = await fetch("/save", {
      method: "POST",
      headers: {
        "Content-Type": contentType,
      },
      body,
    });

    if (!res.ok) {
      alert("保存失败");
      return;
    }

    window.location = res.url;
  });


  // 文件拖放
  textEl.addEventListener("dragover", (event) => {
    event.preventDefault();
  });

  textEl.addEventListener("drop", async (event) => {
    event.preventDefault();

    const file = event.dataTransfer.files[0];
    if (!file) return;

    const body = await file.arrayBuffer();

    const res = await fetch("/save", {
      method: "POST",
      headers: {
        "Content-Type": file.type,
        "X-File-Extension": file.name.match(/\.(.+)$/)?.[1] || "",
      },
      body
    });

    if (!res.ok) {
      alert("保存失败");
      return;
    }

    window.location = res.url;
  });
</script>

<style>
  #text {
    width: 100%;
    height: 100%;
    outline: none;

    &:empty:before {
      content: "请输入内容，按 Ctrl/Cmd + S 保存，按 Ctrl/Cmd + Alt + S 保存纯文本，或者也可以拖放文件到此处";
      color: #aaa;
      cursor: text;
    }
  }
</style>
