<div id="text" contenteditable="true"></div>

<script>
  document
    .querySelector("#text")
    .addEventListener("keydown", async function (event) {
      if (event.key !== "s") return;
      if (!(navigator.platform.match("Mac") ? event.metaKey : event.ctrlKey))
        return;
      event.preventDefault();

      const body = document
        .querySelector("#text")
        .innerHTML.replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">");

      const bodyBuf = new TextEncoder().encode(body);

      const digest = await crypto.subtle.digest("SHA-256", bodyBuf);
      const hashArray = Array.from(new Uint8Array(digest));
      const hashHex = hashArray
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
      const id = hashHex.slice(0, 10);

      const res = await fetch(`/${id}`, {
        method: "POST",
        headers: {
          "Content-Type": "text/html",
        },
        body,
      });

      if (!res.ok) {
        alert("Failed to save");
        return;
      }

      window.location = `/${id}`;
    });
</script>

<style>
  #text {
    width: 100%;
    height: 100%;
    outline: none;
  }
</style>
