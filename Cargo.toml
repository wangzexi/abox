[package]
name = "abox"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
mime_guess = "2"
futures-util = "0.3"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
sha2 = "0.10"
subtle = "2"
tokio-util = { version = "0.7", features = ["io"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
